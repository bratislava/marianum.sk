fragment FlatNavigationItem on NavigationItem {
  id
  title
  path
  type
  related {
    __typename
    ... on Page {
      title
      slug
    }
  }
}

fragment NavigationItem on NavigationItem {
  ...FlatNavigationItem
  items {
    ...FlatNavigationItem
    items {
      ...FlatNavigationItem
      items {
        ...FlatNavigationItem
        items {
          ...FlatNavigationItem
        }
      }
    }
  }
}

