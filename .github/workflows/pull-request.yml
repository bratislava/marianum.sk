name: Pull Request
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast gate on public runners, ahead of the self-hosted image builds below.
  checks:
    name: Lint Next
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: next/package-lock.json
      - run: npm ci
      - run: npm run lint

  # Both images are built with the real production target and never pushed, so
  # a PR fails on anything that would break the deploy build - including type
  # errors, which `next build` reports.
  build-next:
    name: Build Next
    needs: checks
    uses: ./.github/workflows/build-next.yml
    secrets: inherit
    with:
      directory: next/
      image: harbor.bratislava.sk/standalone/marianum-next

  build-strapi:
    name: Build Strapi
    needs: checks
    uses: ./.github/workflows/build-single-image.yml
    secrets: inherit
    with:
      directory: strapi/
      image: harbor.bratislava.sk/standalone/marianum-strapi
